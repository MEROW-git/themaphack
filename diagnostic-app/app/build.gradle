plugins {
    id 'com.android.application'
}

android {
    namespace 'org.themaphack.diagnostics'
    compileSdk 36
    ndkVersion '29.0.13846066'

    defaultConfig {
        applicationId 'org.themaphack.diagnostics'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '4.3.1'
        }
    }
}
